# @package _global_

project: 'ppo-dmc'
device: cuda
algorithm: ppo

env_suite: dmc            # envs/dmc_gymnasium.py
env_name: walker_walk
num_envs: 8
seed: 1
gamma: 0.99
context_len: 16          # window length of ContextWindowWrapper (triplets per sample); <= pretraining traj_length

# Pretraining normalizer stats (offline_training.py with settings.env_transforms.enabled)
env_transforms_path: null
freeze_env_transforms: false
# Cap on the loaded RunningMeanStd counts (~1e7 from pretraining). The stats are a cumulative
# average: after n steps per env the online data has weight n / (c + n), e.g. 50% at 10k steps
# and 93% at 125k (1M steps / 8 envs). null keeps the pretraining count (effectively frozen).
env_transforms_prior_count: 10000

trainer_cfg:
  env_name: ${env_name}
  num_envs: ${num_envs}
  seed: ${seed}
  gamma: ${gamma}
  use_wandb: ${use_wandb}

  total_steps: 1000000
  rollout_steps: 256
  save_interval: 100000
  save_path: 'snapshots/walker_walk/ppo_maskdp/model.pt'

  # PPO hyperparameters: identical to configs/ppo_baseline/settings/walker2d.yaml
  policy_lr: 0.0003        # actor head
  value_lr: 0.0003         # critic head
  trunk_lr: null           # shared encoder/decoder; null -> policy_lr
  anneal_lr: true
  optim: adam
  optim_eps: 0.00001

  minibatch_size: 64
  update_epochs: 10
  clip_eps: 0.2
  gae_lambda: 0.95
  ent_coef: 0.0
  vf_coef: 0.5             # now also weights the critic's gradient into the shared trunk
  max_grad_norm: 0.5       # clipped jointly over the whole model

  model:
    arch: maskdp           # agents/actor_critic/maskdp_actor_critic.MaskDPActorCritic
    pretrained_path: 'snapshots/pretrained_mdp/walker/walker_walk_9999_1.pt'
    context_len: ${context_len}
    # n_embd / n_head / n_enc_layer / n_dec_layer are read from the pretrained snapshot
    attn_pdrop: 0.0        # keep 0 for PPO (rollout/update log-prob consistency)
    resid_pdrop: 0.0
    # true: new actor and critic MLPs (baseline Actor/Critic, pretrained action_head unused)
    # on [decoder latent, current normalized state s_t]
    fresh_heads: false
    # true: freeze the pretrained encoder/decoder trunk and train only the actor/critic heads
    # (see settings/walker_walk_maskdp_frozen.yaml)
    freeze_backbone: false
